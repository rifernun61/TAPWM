<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Atividade 14 - Formulário Principal com validação em JavaScript" />
  <title>Atividade 14 – Formulário Principal</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <div class="page-wrapper">
    <header class="page-header">
      <h1>Formulário Principal</h1>
      <p class="subtitle">Preencha todos os campos corretamente</p>
    </header>

    <main class="card">
      <form
        name="nomeform"
        id="nomeform"
        onsubmit="return validar()"
        novalidate
      >

        <!-- Nome -->
        <div class="field-group">
          <label for="nome">Nome:</label>
          <input
            type="text"
            id="nome"
            name="nome"
            placeholder="Mínimo 10 caracteres"
            autocomplete="name"
          />
          <span class="error-msg" id="erro-nome"></span>
        </div>

        <!-- E-mail -->
        <div class="field-group">
          <label for="email">E-mail:</label>
          <input
            type="email"
            id="email"
            name="email"
            placeholder="seu@email.com"
            autocomplete="email"
          />
          <span class="error-msg" id="erro-email"></span>
        </div>

        <!-- Comentário -->
        <div class="field-group">
          <label for="comentario">Comentário:</label>
          <textarea
            id="comentario"
            name="comentario"
            rows="5"
            placeholder="Mínimo 20 caracteres"
          ></textarea>
          <span class="error-msg" id="erro-comentario"></span>
        </div>

        <!-- Pesquisa (Radio) -->
        <fieldset class="pesquisa-group">
          <legend>Pesquisa:</legend>
          <p class="pesquisa-pergunta">Primeira vez nesta página?</p>
          <div class="radio-row">
            <label class="radio-label">
              <input type="radio" name="pesquisa" value="sim" id="radio-sim" />
              <span class="radio-custom"></span>
              Sim
            </label>
            <label class="radio-label">
              <input type="radio" name="pesquisa" value="nao" id="radio-nao" />
              <span class="radio-custom"></span>
              Não
            </label>
          </div>
          <span class="error-msg" id="erro-pesquisa"></span>
        </fieldset>

        <!-- Botões -->
        <div class="btn-row">
          <button type="submit" id="btn-enviar" class="btn btn-enviar">Enviar</button>
          <button type="reset"  id="btn-limpar" class="btn btn-limpar" onclick="limparErros()">Limpar</button>
        </div>

      </form>
    </main>

    <!-- Modal de resultado -->
    <div class="modal-overlay" id="modal-overlay" aria-hidden="true">
      <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-titulo">
        <div class="modal-icon" id="modal-icon">✅</div>
        <h2 id="modal-titulo">Obrigado!</h2>
        <p id="modal-msg"></p>
        <button class="btn btn-enviar" id="btn-fechar" onclick="fecharModal()">Fechar</button>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>

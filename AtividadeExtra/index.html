<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atividade Extra</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f0f4f8;
            color: #333;
            margin: 0;
            padding: 40px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container {
            max-width: 800px;
            width: 100%;
            background: #ffffff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
        }
        h1 {
            color: #1e3a8a;
            border-bottom: 2px solid #e2e8f0;
            padding-bottom: 15px;
            margin-top: 0;
        }
        p {
            color: #64748b;
            font-size: 1.1em;
        }
        .card {
            background: #f8fafc;
            border-left: 5px solid #3b82f6;
            padding: 15px 20px;
            margin: 15px 0;
            border-radius: 0 8px 8px 0;
            transition: transform 0.2s;
        }
        .card:hover {
            transform: translateX(5px);
        }
        .method-title {
            font-weight: bold;
            color: #1e3a8a;
            font-size: 1.05em;
            margin-bottom: 5px;
        }
        .result-text {
            font-style: italic;
            color: #475569;
            background: #ffffff;
            padding: 10px;
            border-radius: 6px;
            border: 1px solid #e2e8f0;
            margin-top: 8px;
        }
        .footer-note {
            margin-top: 30px;
            font-size: 0.9em;
            color: #94a3b8;
            text-align: center;
        }
    </style>
</head>
<body>

<div class="container">    
    <div id="output-container"></div>
    <div class="footer-note">
        
    </div>
</div>

<script>
    const pessoa1 = {
      nome: "João",
      sidebar: "não",
      idade: 20,
      hobby: "tocar violão",
      apresentar: function() {
        return `Olá, meu nome é ${this.nome}, tenho ${this.idade} anos e meu hobby é ${this.hobby}`;
      }
    };

    const pessoa2 = new Object();
    pessoa2.nome = "Maria";
    pessoa2.idade = 25;
    pessoa2.hobby = "ler livros";
    pessoa2.apresentar = function() {
      return `Olá, meu nome é ${this.nome}, tenho ${this.idade} anos e meu hobby é ${this.hobby}`;
    };

    function PessoaConstrutora(nome, idade, hobby) {
      this.nome = nome;
      this.idade = idade;
      this.hobby = hobby;
      this.apresentar = function() {
        return `Olá, meu nome é ${this.nome}, tenho ${this.idade} anos e meu hobby é ${this.hobby}`;
      };
    }
    const pessoa3 = new PessoaConstrutora("Carlos", 30, "jogar futebol");

    class PessoaClasse {
      constructor(nome, idade, hobby) {
        this.nome = nome;
        this.idade = idade;
        this.hobby = hobby;
      }
      apresentar() {
        return `Olá, meu nome é ${this.nome}, tenho ${this.idade} anos e meu hobby é ${this.hobby}`;
      }
    }
    const pessoa4 = new PessoaClasse("Ana", 28, "pintar quadros");

    const pessoaPrototipo = {
      apresentar: function() {
        return `Olá, meu nome é ${this.nome}, tenho ${this.idade} anos e meu hobby é ${this.hobby}`;
      }
    };
    const pessoa5 = Object.create(pessoaPrototipo);
    pessoa5.nome = "Lucas";
    pessoa5.idade = 22;
    pessoa5.hobby = "jogar videogame";

    const pessoas = [pessoa1, pessoa2, pessoa3, pessoa4, pessoa5];
    const metodos = [
        "Objeto Literal (literais)",
        "Instância de Object (object)",
        "Função Construtora (função construtora)",
        "Classe (classe)",
        "Object.create (create)"
    ];

    const container = document.getElementById('output-container');

    console.log("--- Teste do método apresentar() ---");

    pessoas.forEach((pessoa, index) => {
        console.log(`Objeto ${index + 1}:`, pessoa.apresentar());

        const card = document.createElement('div');
        card.className = 'card';

        card.innerHTML = `
            <div class="method-title">pessoa${index + 1} - Criado via ${metodos[index]}</div>
            <div class="result-text">"${pessoa.apresentar()}"</div>
        `;

        container.appendChild(card);
    });
</script>

</body>
</html>
